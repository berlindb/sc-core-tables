name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
  # Fired by berlindb/core on push to master (the cross-repo canary).
  repository_dispatch:
    types: [ core-updated ]

jobs:
  resolve:
    name: Resolve SC stable tag
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.pick.outputs.stable }}
    steps:
      - id: pick
        run: |
          README=$(curl --fail --silent --show-error --location https://plugins.svn.wordpress.org/sugar-calendar-lite/trunk/readme.txt)
          STABLE=$(printf '%s\n' "$README" | awk 'tolower($1) == "stable" && tolower($2) == "tag:" { print $3; exit }' | tr -d '\r')
          if [[ ! "$STABLE" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unable to resolve a numeric Sugar Calendar stable tag: $STABLE" >&2
            exit 1
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "Latest Sugar Calendar release: $STABLE"

  phpunit:
    name: PHP ${{ matrix.php }} / SC ${{ matrix.sc }}
    runs-on: ubuntu-latest
    needs: resolve

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
        sc:  [ 'stable', 'trunk' ]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6

      - name: Checkout berlindb/core
        uses: actions/checkout@v6
        with:
          repository: berlindb/core
          # The exact core commit when fired by the canary, else master.
          ref: ${{ github.event.client_payload.sha || 'master' }}
          path: berlindb-core

      - name: Install Subversion
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends subversion

      - name: Export Sugar Calendar from WordPress.org
        env:
          SC_CHANNEL: ${{ matrix.sc }}
          SC_STABLE: ${{ needs.resolve.outputs.stable }}
        run: |
          if [ "$SC_CHANNEL" = "stable" ]; then
            SC_PATH="tags/$SC_STABLE"
          else
            SC_PATH=trunk
          fi
          svn export --non-interactive --quiet "https://plugins.svn.wordpress.org/sugar-calendar-lite/$SC_PATH" sc-src
          test -f sc-src/sugar-calendar-lite.php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Normalize core to a master branch
        # The composer `path` repo derives its version from the checked-out branch. The
        # canary checks out an exact SHA (detached HEAD), which advertises dev-<sha> and
        # fails the `berlindb/core: dev-master` constraint. Force a local master branch at
        # whatever was checked out, so it advertises dev-master while testing that commit.
        run: git -C berlindb-core checkout -B master

      - name: Point composer at the checked-out core
        run: composer config repositories.berlindb-core path ./berlindb-core

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Use mysql_native_password auth
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot --ssl-mode=DISABLED --get-server-public-key -e "ALTER USER 'root'@'%' IDENTIFIED WITH mysql_native_password BY 'root';"

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 latest

      - name: PHPUnit (capability test vs live Sugar Calendar)
        env:
          SC_PLUGIN_FILE: ${{ github.workspace }}/sc-src/sugar-calendar-lite.php
        run: composer test
